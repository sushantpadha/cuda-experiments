# vmemd limits: bin/vmemd --config daemon/vmemd.toml
# values in MiB; a missing key or -1 means no limit

# device memory the broker hands out; keep a margin below the card's VRAM
# for CUDA contexts and memory outside libvmem (RTX 4050 Laptop: 5770 MiB)
vram_limit_mib = 5000

# pinned host memory the broker hands out; pinned pages cannot be swapped,
# so stay well below the machine's free RAM (this laptop: 15 GB)
dram_limit_mib = 8000

# VRAM each tenant's CUDA context takes outside libvmem; added to its device
# usage on Hello.
# ! this is an estimate; actual value can also vary over runtime and change when MPS is on
# this is a reasonable (not hard) upper bound
ctx_overhead_mib = 100
